<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>MD Next Period L3-L1 ज़ोन + R3 हर्डल स्कैनर</title>
    
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22MD%20Next%20Period%20Scanner%22%2C%22short_name%22%3A%22MD%20Next%20Zone%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23090d16%22%2C%22theme_color%22%3A%22%232563eb%22%7D">

    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131b2e;
            --accent: #2563eb;
            --cyan: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --pink: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 90px; }

        header {
            background: linear-gradient(180deg, #131b2e 0%, #090d16 100%);
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-title h1 { font-size: 1.02rem; font-weight: 800; color: var(--cyan); }
        .header-title p { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }

        .btn-fetch {
            background: rgba(16, 185, 129, 0.2); border: 1px solid var(--green);
            color: #34d399; padding: 7px 11px; border-radius: 20px;
            font-size: 0.72rem; font-weight: 700; cursor: pointer;
        }

        .status-bar {
            padding: 8px 16px; background: #0d1322; border-bottom: 1px solid var(--border);
            font-size: 0.72rem; color: var(--amber); display: flex; justify-content: space-between; align-items: center;
        }

        .search-bar {
            padding: 10px 16px; background: #0b101d; border-bottom: 1px solid var(--border);
            display: flex; gap: 8px;
        }
        .search-bar input {
            flex: 1; background: #131b2e; border: 1px solid var(--border); color: #fff;
            padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; text-transform: uppercase;
        }
        .search-bar button {
            background: var(--accent); color: #fff; border: none; padding: 8px 14px;
            border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
        }

        .mode-tabs {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            padding: 10px 16px; background: #0d1322; border-bottom: 1px solid var(--border);
        }
        .mode-btn {
            background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted);
            padding: 9px 8px; border-radius: 9px; font-size: 0.74rem; font-weight: 700; cursor: pointer; text-align: center;
        }
        .mode-btn.active { background: rgba(16, 185, 129, 0.18); border-color: var(--green); color: #34d399; }
        .mode-btn.active-all { background: rgba(56, 189, 248, 0.18); border-color: var(--cyan); color: var(--cyan); }

        .breadcrumb {
            padding: 10px 16px; font-size: 0.8rem; background: rgba(37, 99, 235, 0.12);
            border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .breadcrumb a { color: var(--cyan); text-decoration: underline; cursor: pointer; font-weight: 600; }

        .container { padding: 16px; }
        .tf-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .tf-card {
            background: var(--card-bg); border: 1px solid rgba(16, 185, 129, 0.45);
            border-radius: 12px; padding: 15px; cursor: pointer;
        }
        .tf-title { font-size: 0.95rem; font-weight: 700; color: #fff; }
        .tf-number { font-size: 1.65rem; font-weight: 800; color: var(--green); }

        .sector-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .sector-count-pill {
            background: rgba(16, 185, 129, 0.18); border: 1px solid rgba(16, 185, 129, 0.5);
            color: #34d399; padding: 6px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 700;
        }

        .stock-card {
            background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--green);
            border-radius: 12px; padding: 14px; margin-bottom: 14px;
        }
        .stock-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .stock-sym { font-size: 1.08rem; font-weight: 800; color: #fff; }
        .stock-ltp { font-size: 1.12rem; font-weight: 800; color: var(--cyan); text-align: right; }

        .status-tag {
            display: inline-block; margin-top: 5px; padding: 3px 8px; border-radius: 5px;
            font-size: 0.67rem; font-weight: 700;
        }
        .tag-cross { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .tag-watch { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }

        .zone-box {
            background: #090d16; border: 1px solid #1e293b; border-radius: 8px;
            padding: 9px 10px; margin: 10px 0 8px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 0.74rem;
        }
        .zone-col span { display: block; font-size: 0.64rem; color: var(--text-muted); }

        .profit-banner {
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.14) 0%, rgba(244, 63, 94, 0.12) 100%);
            border: 1px solid rgba(16, 185, 129, 0.45); border-radius: 8px;
            padding: 10px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .profit-left strong { font-size: 0.98rem; color: #34d399; font-weight: 800; display: block; }
        .profit-right { text-align: right; }
        .profit-right strong { font-size: 0.92rem; color: var(--pink); font-weight: 800; display: block; }

        .stock-footer-meta {
            font-size: 0.72rem; color: var(--text-muted); border-top: 1px dashed #283548; padding-top: 8px; line-height: 1.45;
        }

        .loader { text-align: center; padding: 30px; color: var(--cyan); font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>MD Next Period ज़ोन + R3 हर्डल</h1>
            <p>Current Close &rarr; Next Period Cam L3, Trad L1 & R3</p>
        </div>
        <button class="btn-fetch" onclick="fetchAllRealNSEStocks()">🔄 Refresh NSE</button>
    </header>

    <div class="status-bar">
        <span id="sync-status">⏳ Fetching actual NSE prices...</span>
        <span id="last-updated-time"></span>
    </div>

    <div class="search-bar">
        <input type="text" id="new-symbol-input" placeholder="NSE Symbol डालें (जैसे: LT, MARUTI)">
        <button onclick="addCustomNSESymbol()">+ Scan Stock</button>
    </div>

    <div class="mode-tabs">
        <div class="mode-btn active" id="mode-CROSS" onclick="setFilter('CROSS')">⚡ Crossing Next Zone (<span id="cnt-cross">0</span>)</div>
        <div class="mode-btn" id="mode-ALL" onclick="setFilter('ALL')">📊 All Next Period Levels (<span id="cnt-all">0</span>)</div>
    </div>

    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="container" id="main-container">
        <div class="loader">NSE मार्केट से करंट क्लोजिंग प्राइस और Next Period लेवल्स निकाले जा रहे हैं...</div>
    </div>

    <script>
        const TIMEFRAMES = [
            { id: 'Daily',      title: 'Daily (D)',        periodName: 'Next Day',       nextLabel: 'Next Day' },
            { id: 'Weekly',     title: 'Weekly (W)',       periodName: 'Next Week',      nextLabel: 'Next Week' },
            { id: 'Monthly',    title: 'Monthly (M)',      periodName: 'Next Month',     nextLabel: 'Next Month' },
            { id: 'Quarterly',  title: 'Quarterly (3M)',   periodName: 'Next Quarter',   nextLabel: 'Next Quarter' },
            { id: 'HalfYearly', title: 'Half-Yearly (6M)', periodName: 'Next Half-Year', nextLabel: 'Next 6M' },
            { id: 'Yearly',     title: 'Yearly (12M)',     periodName: 'Next Year',      nextLabel: 'Next Year' }
        ];

        let WATCHLIST = JSON.parse(localStorage.getItem('md_nse_watchlist_v2')) || [
            { symbol: "LT", name: "Larsen & Toubro Ltd", sector: "Infra & Capital Goods", theme: "National Infrastructure", industry: "Engineering & Construction", category: "Large Cap" },
            { symbol: "HDFCBANK", name: "HDFC Bank Ltd", sector: "Banking & Finance", theme: "Private Banking Core", industry: "Private Sector Bank", category: "Large Cap" },
            { symbol: "RELIANCE", name: "Reliance Industries Ltd", sector: "Oil, Gas & Energy", theme: "Energy & Telecom Giant", industry: "Refineries & Petrochemicals", category: "Large Cap" },
            { symbol: "HAL", name: "Hindustan Aeronautics Ltd", sector: "Defense & Aerospace", theme: "Make in India Defense", industry: "Aerospace & Defense", category: "Large Cap" },
            { symbol: "BEL", name: "Bharat Electronics Ltd", sector: "Defense & Aerospace", theme: "Defense Electronics", industry: "Defense Equipment", category: "Large Cap" },
            { symbol: "TCS", name: "Tata Consultancy Services", sector: "IT & Digital", theme: "AI & Cloud Services", industry: "IT Consulting", category: "Large Cap" },
            { symbol: "INFY", name: "Infosys Limited", sector: "IT & Digital", theme: "Digital Transformation", industry: "IT Software", category: "Large Cap" },
            { symbol: "SBIN", name: "State Bank of India", sector: "Banking & Finance", theme: "PSU Banking Leader", industry: "Public Sector Bank", category: "Large Cap" },
            { symbol: "NTPC", name: "NTPC Limited", sector: "Power & Renewables", theme: "Green Energy Transition", industry: "Power Generation", category: "Large Cap" },
            { symbol: "SUNPHARMA", name: "Sun Pharmaceutical Ind", sector: "Pharma & Healthcare", theme: "Specialty Pharma", industry: "Pharmaceuticals", category: "Large Cap" }
        ];

        let calculatedRecords = [];
        let filterMode = 'CROSS';
        let nav = { tf: null, sector: null };

        async function fetchStockHistoryNSE(stockMeta) {
            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${stockMeta.symbol}.NS?range=2y&interval=1d`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`;

            const response = await fetch(proxyUrl);
            const data = await response.json();
            const result = data.chart.result[0];
            const timestamps = result.timestamp;
            const quote = result.indicators.quote[0];
            const meta = result.meta;

            let candles = [];
            for (let i = 0; i < timestamps.length; i++) {
                if (quote.high[i] !== null && quote.low[i] !== null && quote.close[i] !== null) {
                    candles.push({
                        high: quote.high[i],
                        low: quote.low[i],
                        close: quote.close[i]
                    });
                }
            }

            if (candles.length < 255) return [];

            // Latest / Current Closing Price & Today's Candle
            const latestCandle = candles[candles.length - 1];
            const currentClose = meta.regularMarketPrice || latestCandle.close;
            const todayHigh    = Math.max(latestCandle.high, currentClose);
            const todayLow     = Math.min(latestCandle.low, currentClose);

            // Calculate CURRENT Period OHLC (including today's latest close) to project NEXT PERIOD levels
            function getCurrentPeriodOHLC(daysCount) {
                const slice = candles.slice(Math.max(0, candles.length - daysCount));
                const curHigh  = Math.max(...slice.map(c => c.high), currentClose);
                const curLow   = Math.min(...slice.map(c => c.low), currentClose);
                const curClose = currentClose;
                return { curHigh, curLow, curClose };
            }

            const currentPeriods = {
                Daily:      getCurrentPeriodOHLC(1),     // Today's H, L, C -> Next Day Levels
                Weekly:     getCurrentPeriodOHLC(5),     // Current Week's H, L, C -> Next Week Levels
                Monthly:    getCurrentPeriodOHLC(21),    // Current Month's H, L, C -> Next Month Levels
                Quarterly:  getCurrentPeriodOHLC(63),    // Current Quarter's H, L, C -> Next Quarter Levels
                HalfYearly: getCurrentPeriodOHLC(125),   // Current 6M's H, L, C -> Next 6M Levels
                Yearly:     getCurrentPeriodOHLC(252)    // Current Year's H, L, C -> Next Year Levels
            };

            let stockEntries = [];
            Object.entries(currentPeriods).forEach(([tfId, ohlc]) => {
                const range = ohlc.curHigh - ohlc.curLow;
                
                // NEXT PERIOD Camarilla L3 & R3 (Hurdle)
                const nextCamL3 = ohlc.curClose - (range * 1.1 / 4);
                const nextCamR3 = ohlc.curClose + (range * 1.1 / 4);
                
                // NEXT PERIOD Traditional Pivot L1 (S1)
                const nextPP = (ohlc.curHigh + ohlc.curLow + ohlc.curClose) / 3;
                const nextTradL1 = (2 * nextPP) - ohlc.curHigh;

                const nextZoneLow  = Math.min(nextCamL3, nextTradL1);
                const nextZoneHigh = Math.max(nextCamL3, nextTradL1);

                // Gap from Current Closing Price to Next Period Cam R3 Hurdle
                const gapPoints = Math.max(0, nextCamR3 - currentClose);
                const gapPct = (gapPoints / currentClose) * 100;

                // Check if Today's Candle / Current Close is crossing or touching the Next Period Zone
                const isCrossingNextZone = (todayLow <= nextZoneHigh && todayHigh >= nextZoneLow) ||
                                           (Math.abs(currentClose - nextZoneHigh) / currentClose <= 0.015);

                stockEntries.push({
                    ...stockMeta,
                    tf: tfId,
                    currentClose: currentClose.toFixed(2),
                    todayLow: todayLow.toFixed(2),
                    todayHigh: todayHigh.toFixed(2),
                    nextCamL3: nextCamL3.toFixed(2),
                    nextTradL1: nextTradL1.toFixed(2),
                    nextCamR3: nextCamR3.toFixed(2),
                    nextZoneLow: nextZoneLow.toFixed(2),
                    nextZoneHigh: nextZoneHigh.toFixed(2),
                    gapPoints: gapPoints.toFixed(2),
                    gapPct: gapPct.toFixed(2),
                    isCrossing: isCrossingNextZone
                });
            });

            return stockEntries;
        }

        async function fetchAllRealNSEStocks() {
            const statusEl = document.getElementById('sync-status');
            statusEl.innerText = "🔄 Fetching NSE Closing & Next Period Levels...";
            
            let allResults = [];
            for (let st of WATCHLIST) {
                try {
                    statusEl.innerText = `⏳ Calculating Next Period: ${st.symbol}...`;
                    const entries = await fetchStockHistoryNSE(st);
                    allResults.push(...entries);
                } catch (err) {
                    console.warn("Error fetching", st.symbol, err);
                }
            }

            if (allResults.length > 0) {
                calculatedRecords = allResults;
                const now = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                statusEl.innerHTML = `<span style="color:#10b981;">✅ Real NSE Closing Synced (${WATCHLIST.length} Stocks)</span>`;
                document.getElementById('last-updated-time').innerText = `Updated: ${now}`;
                render();
            } else {
                statusEl.innerText = "⚠️ Network busy. Tap 'Refresh NSE' again.";
            }
        }

        async function addCustomNSESymbol() {
            const input = document.getElementById('new-symbol-input');
            const sym = input.value.trim().toUpperCase().replace('.NS', '');
            if (!sym) return;

            if (!WATCHLIST.some(s => s.symbol === sym)) {
                WATCHLIST.unshift({
                    symbol: sym,
                    name: `${sym} (NSE Equity)`,
                    sector: "Custom NSE Watchlist",
                    theme: "Direct NSE Scan",
                    industry: "NSE Listed",
                    category: "Equity"
                });
                localStorage.setItem('md_nse_watchlist_v2', JSON.stringify(WATCHLIST));
            }
            input.value = '';
            await fetchAllRealNSEStocks();
        }

        function setFilter(mode) {
            filterMode = mode;
            document.getElementById('mode-CROSS').className = mode === 'CROSS' ? 'mode-btn active' : 'mode-btn';
            document.getElementById('mode-ALL').className = mode === 'ALL' ? 'mode-btn active-all' : 'mode-btn';
            render();
        }

        function goHome() { nav.tf = null; nav.sector = null; render(); }
        function openTF(id) { nav.tf = id; nav.sector = null; render(); }
        function openSec(tf, sec) { nav.tf = tf; nav.sector = sec; render(); }

        function render() {
            const crossingList = calculatedRecords.filter(r => r.isCrossing);
            document.getElementById('cnt-cross').innerText = crossingList.length;
            document.getElementById('cnt-all').innerText = calculatedRecords.length;

            const activeList = (filterMode === 'CROSS') ? crossingList : calculatedRecords;
            const container = document.getElementById('main-container');
            const bc = document.getElementById('breadcrumb');

            if (!nav.tf) {
                bc.innerHTML = `<span>📊 Select Timeframe (Current Close &rarr; Next Period)</span>`;
                let html = `<div class="tf-grid">`;
                TIMEFRAMES.forEach(tf => {
                    const list = activeList.filter(s => s.tf === tf.id);
                    const secs = new Set(list.map(s => s.sector)).size;
                    html += `
                        <div class="tf-card" onclick="openTF('${tf.id}')">
                            <div class="tf-title">${tf.title} &rarr;</div>
                            <div style="margin-top:6px;"><span class="tf-number">${list.length}</span> <span style="font-size:0.75rem;color:#94a3b8;">Stocks</span></div>
                            <div style="font-size:0.72rem;color:var(--cyan);margin-top:4px;">${secs} Sectors &bull; ${tf.nextLabel} Hurdle</div>
                        </div>`;
                });
                container.innerHTML = html + `</div>`;
            } else if (nav.tf && !nav.sector) {
                const tfObj = TIMEFRAMES.find(t => t.id === nav.tf);
                bc.innerHTML = `<a onclick="goHome()">All Timeframes</a> &rsaquo; <span>${tfObj.title}</span>`;
                const list = activeList.filter(s => s.tf === nav.tf);
                const grouped = {};
                list.forEach(s => { (grouped[s.sector] = grouped[s.sector] || []).push(s); });
                let html = ``;
                Object.keys(grouped).forEach(sec => {
                    html += `
                        <div class="sector-card" onclick="openSec('${nav.tf}', '${sec}')">
                            <div><h3>${sec}</h3><p style="font-size:0.74rem;color:#94a3b8;">${tfObj.nextLabel} L3-L1 Zone & Cam R3 Hurdle</p></div>
                            <div class="sector-count-pill">${grouped[sec].length} Stocks &rsaquo;</div>
                        </div>`;
                });
                container.innerHTML = html || `<p style="color:#94a3b8;text-align:center;">इस टाइमफ्रेम में कोई स्टॉक क्रॉस नहीं कर रहा है। ऊपर 'All Next Period Levels' देखें।</p>`;
            } else {
                const tfObj = TIMEFRAMES.find(t => t.id === nav.tf);
                bc.innerHTML = `<a onclick="goHome()">All TF</a> &rsaquo; <a onclick="openTF('${nav.tf}')">${tfObj.title}</a> &rsaquo; <span>${nav.sector}</span>`;
                const list = activeList.filter(s => s.tf === nav.tf && s.sector === nav.sector);
                let html = ``;
                list.forEach(st => {
                    html += `
                        <div class="stock-card" style="border-left-color: ${st.isCrossing ? 'var(--green)' : 'var(--amber)'};">
                            <div class="stock-top">
                                <div>
                                    <div class="stock-sym">NSE: ${st.symbol}</div>
                                    <div style="font-size:0.74rem;color:#94a3b8;">${st.name}</div>
                                    <span class="status-tag ${st.isCrossing ? 'tag-cross' : 'tag-watch'}">
                                        ${st.isCrossing ? `⚡ CROSSING ${tfObj.nextLabel.toUpperCase()} ZONE` : `📌 ${tfObj.nextLabel.toUpperCase()} PROJECTION`}
                                    </span>
                                </div>
                                <div>
                                    <div class="stock-ltp">₹${st.currentClose}</div>
                                    <div style="font-size:0.68rem;color:#94a3b8;">Current Close (Day L: ₹${st.todayLow} | H: ₹${st.todayHigh})</div>
                                </div>
                            </div>
                            <div class="zone-box">
                                <div class="zone-col"><span>${tfObj.nextLabel} Cam L3</span><strong>₹${st.nextCamL3}</strong></div>
                                <div class="zone-col"><span>${tfObj.nextLabel} Trad L1</span><strong>₹${st.nextTradL1}</strong></div>
                                <div class="zone-col"><span>${tfObj.nextLabel} Zone</span><strong style="color:var(--cyan);">₹${st.nextZoneLow}-${st.nextZoneHigh}</strong></div>
                            </div>
                            <div class="profit-banner">
                                <div class="profit-left">
                                    <span>🎯 ${tfObj.nextLabel} Profit Gap (Points)</span>
                                    <strong>+₹${st.gapPoints} pts (+${st.gapPct}%)</strong>
                                </div>
                                <div class="profit-right">
                                    <span>🚧 ${tfObj.nextLabel} Cam R3 Hurdle</span>
                                    <strong>₹${st.nextCamR3}</strong>
                                </div>
                            </div>
                            <div class="stock-footer-meta">
                                <b>Category:</b> ${st.category} &bull; <b>Theme:</b> ${st.theme}<br>
                                <b>Industry:</b> ${st.industry} &bull; <b>Sector:</b> ${st.sector}
                            </div>
                        </div>`;
                });
                container.innerHTML = html;
            }
        }

        setFilter('CROSS');
        fetchAllRealNSEStocks();
    </script>
</body>
</html>
